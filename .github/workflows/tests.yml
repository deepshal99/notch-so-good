name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build and test
        run: bash run-tests.sh
      - name: Installers parse
        run: |
          for f in *.sh HookInstaller/*.sh; do bash -n "$f"; done
