<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 · Notch So Good</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* 404, spelled in islands: the landing page's frame and world, the digits drawn as black notch shapes */
    html, body { height: 100%; }
    body.e404 { overflow: hidden; }
    .e404 main { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 6vh 24px 0; }
    .digits { position: relative; width: min(66vw, 700px); margin: 0; }
    .digits svg { display: block; width: 100%; height: auto; overflow: visible; position: relative; z-index: 2; pointer-events: none; }
    /* each piece springs open like the island, one after another */
    .digits .pc { transform-box: fill-box; transform-origin: 50% 50%; scale: 0; transition: scale var(--bouncy-t, 0.6s) var(--bouncy, ease-out); transition-delay: calc(var(--d) * 70ms + 200ms); }
    .e404.ready .digits .pc { scale: 1; }
    .e404.leaving .digits .pc { scale: 0; transition: scale 0.32s var(--out, ease-in); transition-delay: calc((8 - var(--d)) * 30ms); }
    #peek404 { position: absolute; left: 50%; translate: -50% 0; z-index: 1; pointer-events: none; opacity: 0; transition: opacity 0.4s ease-out 0.75s; }
    body.on-peek { cursor: pointer; }
    .e404.ready #peek404 { opacity: 1; }
    .e404 .lede { margin-top: clamp(110px, 19vh, 190px); opacity: 0; translate: 0 10px; transition: opacity 0.5s ease-out 0.9s, translate 0.7s var(--island) 0.9s; }
    .e404 .home { margin-top: 22px; opacity: 0; translate: 0 10px; transition: opacity 0.5s ease-out 1s, translate 0.7s var(--island) 1s, scale 0.15s ease-out, background-color 0.2s; }
    .e404.ready .lede, .e404.ready .home { opacity: 1; translate: 0 0; }
    .e404.leaving .lede, .e404.leaving .home { opacity: 0; transition-delay: 0s; }
    @media (max-width: 720px) { .digits { width: 86vw; } .e404 .lede { margin-top: 104px; } }
    @media (prefers-reduced-motion: reduce) { .digits .pc, .e404 .lede, .e404 .home, #peek404 { transition: none; } }
  </style>
</head>
<body class="e404">
  <div class="world" id="world" aria-hidden="true"><i></i><i></i></div>
  <div class="bezel" aria-hidden="true"><i class="tl"></i><i class="tr"></i></div>
  <div class="stage" aria-hidden="true"><div id="island"></div></div>

  <main>
    <h1 class="digits" aria-label="404, page not found">
      <svg viewBox="0 0 1000 400" aria-hidden="true">
        <g fill="none" stroke="#000" stroke-width="64" stroke-linecap="round">
          <!-- 4 -->
          <path class="pc" style="--d:0" d="M78 222 L158 142"/>
          <path class="pc" style="--d:1" d="M232 64 L232 186"/>
          <path class="pc" style="--d:2" d="M44 268 L292 268"/>
          <path class="pc" style="--d:3" d="M232 334 L232 346"/>
          <!-- 4 -->
          <path class="pc" style="--d:5" d="M738 222 L818 142"/>
          <path class="pc" style="--d:6" d="M892 64 L892 186"/>
          <path class="pc" style="--d:7" d="M704 268 L952 268"/>
          <path class="pc" style="--d:8" d="M892 334 L892 346"/>
        </g>
        <!-- 0: a squarish island, open in the middle. Its long flat bottom is the notch Peek hangs from (and hides his clipped top) -->
        <path class="pc zero" style="--d:4" fill="#000" fill-rule="evenodd"
          d="M402 32 H598 A42 42 0 0 1 640 74 V326 A42 42 0 0 1 598 368 H402 A42 42 0 0 1 360 326 V74 A42 42 0 0 1 402 32 Z
             M460 112 H540 A20 20 0 0 1 560 132 V268 A20 20 0 0 1 540 288 H460 A20 20 0 0 1 440 268 V132 A20 20 0 0 1 460 112 Z"/>
      </svg>
      <canvas id="peek404" aria-label="Peek. Click to change its finish."></canvas>
    </h1>
    <p class="lede">Nothing lives at this address.</p>
    <a class="btn dark sm home" href="/">Take me home</a>
  </main>

<script type="module">
// Peek fell off the notch and caught the 0. He mostly plays dead; now and then he comes round, looks about, tries a
// trick, and flops again. Click him for a new finish (shared with the landing page); the world outside follows.
import { PeekView, FINISHES } from '/peek.js';
import { Island } from '/island.js';
import { sfx } from '/sound.js';
import '/world.js';

const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const now = () => performance.now() / 1000;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const LOOKS = ['neon', 'obsidian', 'obsidian-midnight', 'obsidian-plum', 'obsidian-forest', 'porcelain', 'porcelain-sage', 'porcelain-blush', 'porcelain-sky',
  'gold', 'gold-rose', 'gold-white', 'balloon', 'balloon-sky', 'balloon-lemon', 'balloon-lilac', 'gummy', 'gummy-lime', 'gummy-tangerine', 'gummy-grape'].filter(f => FINISHES[f]);
let finish = localStorage.getItem('nsg-finish-v3');
if (!LOOKS.includes(finish)) finish = 'neon';
const announce = f => document.dispatchEvent(new CustomEvent('nsg:look', { detail: f }));

// the real notch at the top of the screen, empty and at rest
const isl = new Island($('#island'), 1.2);
isl.setScale(clamp(innerWidth / 1200, 0.9, 1.16)); isl.set('', { kind: 'notch' }); isl.snap();

// Peek, hanging from the bottom of the 0
const svg = $('.digits svg'), cv = $('#peek404');
const NOTCH_Y = 0.12, TUCK = 3;
const view = new PeekView(cv, { finish, unitsW: 4.4, unitsH: 3.9, notchY: NOTCH_Y, state: 'error' });
const peek = view.puppet;
let U = 50;
const place = () => {
  const s = svg.getBoundingClientRect().width / 1000;      // svg units → px
  U = clamp(280 * s * 0.31, 32, 80);                        // as big as the 0's flat bottom (196 of its 280 units) can hide
  view.resize(4.4 * U, 3.9 * U, Math.min(devicePixelRatio || 1, 2) * 2);
  cv.style.top = (368 * s - NOTCH_Y * U - TUCK) + 'px';      // gripping the 0's bottom edge
};
place(); addEventListener('resize', place);
announce(finish);

// his routine: mostly dead, with little moments of life
const LIFE = [
  ['need', null], ['think', null], ['idle', 'wave'], ['done', null], ['idle', 'stretch'],
  ['think', null], ['need', null], ['done', 'twirl'], ['idle', 'wave'], ['done', null],
];
let busy = false;
(async () => {
  await sleep(2600);
  for (let i = 0; ; i++) {
    await sleep(2400 + Math.random() * 1800);
    if (document.hidden || busy || leaving) continue;
    const [state, trick] = LIFE[i % LIFE.length];
    peek.setState(state, now());
    if (trick) { await sleep(250); peek.play(trick, now()); sfx.trick(trick); }
    await sleep(trick ? 3400 : 2200);
    if (!busy && !leaving) { peek.setState('error', now()); sfx.wilt(); }
  }
})();

// click Peek: next finish, a bounce, a moment of joy, then back to playing dead
const onPeek = (x, y) => {
  const r = cv.getBoundingClientRect(), P = peek.lastPose || { pos: [0, -0.9, 0] };
  const cx = r.left + r.width / 2 + P.pos[0] * U, cy = r.top + NOTCH_Y * U - P.pos[1] * U;
  return ((x - cx) / (1.15 * U)) ** 2 + ((y - cy) / (1.05 * U)) ** 2 <= 1;
};
let perk = 0;
// the canvas lets clicks through (it's bigger than Peek); hits are tested against his body
addEventListener('pointermove', e => document.body.classList.toggle('on-peek', onPeek(e.clientX, e.clientY)), { passive: true });
addEventListener('click', e => {
  if (e.target.closest('a, button') || !onPeek(e.clientX, e.clientY)) return;
  finish = LOOKS[(LOOKS.indexOf(finish) + 1) % LOOKS.length];
  localStorage.setItem('nsg-finish-v3', finish);
  view.finish = finish; announce(finish);
  sfx.boing(); sfx.material(finish.split('-')[0], LOOKS.indexOf(finish));
  busy = true; clearTimeout(perk);
  peek.setState('done', now()); peek.greet(now()); peek.nudge(0.5 * (Math.random() < 0.5 ? -1 : 1), 1.4);
  perk = setTimeout(() => { busy = false; if (!leaving) { peek.setState('error', now()); sfx.wilt(); } }, 2000);
});

// he watches the pointer
addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  view.gazeTarget = [clamp((e.clientX - r.left - r.width / 2) / 400, -1, 1) * 0.14, clamp((e.clientY - r.top - r.height * 0.3) / 400, -1, 1) * -0.1];
  view.gazeMix = 1;
}, { passive: true });

// home: Peek pulls himself up, the digits fold away, and off we go
let leaving = false;
$('.home').addEventListener('click', e => {
  e.preventDefault(); if (leaving) return; leaving = true;
  sfx.allow(); peek.setState('done', now()); peek.play('pullUp', now());
  document.body.classList.add('leaving');
  setTimeout(() => { location.href = '/'; }, reduced ? 0 : 650);
});

requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('ready')));
const frame = () => { view.draw(now()); requestAnimationFrame(frame); };
requestAnimationFrame(frame);
</script>
</body>
</html>
