<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>404 · Notch So Good</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
  <style>
    /* a giant Peek pops out of the top of the screen, looks at you, and drops dead. That's the page. */
    html, body { height: 100%; margin: 0; background: #fff; overflow: hidden; }
    body.on-peek { cursor: pointer; }
    #giant { position: fixed; left: 50%; top: 0; translate: -50% 0; pointer-events: none; }
    .note { position: fixed; left: 28px; bottom: 24px; margin: 0; font: 500 13px/1.45 var(--sans); letter-spacing: -0.005em; color: var(--ink-3);
      opacity: 0; transition: opacity 0.6s ease-out; }
    .note a { color: var(--ink); text-decoration: underline; text-decoration-color: rgba(11,11,12,0.25); text-underline-offset: 3px; }
    .note a:hover { text-decoration-color: currentColor; }
    body.dead .note { opacity: 1; }
    @media (max-width: 720px) { .note { left: 20px; right: 20px; bottom: calc(18px + env(safe-area-inset-bottom)); } }
  </style>
</head>
<body>
  <canvas id="giant" aria-label="Peek. Click to change its finish."></canvas>
  <p class="note">404. Nothing lives here. <a href="/">Take me home</a></p>

<script type="module">
import { PeekView, FINISHES } from '/peek.js';
import { sfx } from '/sound.js';

const clamp = (x, a, b) => Math.min(Math.max(x, a), b);
const now = () => performance.now() / 1000;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const LOOKS = ['neon', 'obsidian', 'obsidian-midnight', 'obsidian-plum', 'obsidian-forest', 'porcelain', 'porcelain-sage', 'porcelain-blush', 'porcelain-sky',
  'gold', 'gold-rose', 'gold-white', 'balloon', 'balloon-sky', 'balloon-lemon', 'balloon-lilac', 'gummy', 'gummy-lime', 'gummy-tangerine', 'gummy-grape'].filter(f => FINISHES[f]);
let finish = localStorage.getItem('nsg-finish-v3');
if (!LOOKS.includes(finish)) finish = 'neon';

// the top of the screen is the notch: Peek hangs from it, and anything above it is out of sight
const cv = document.getElementById('giant');
const NOTCH_Y = 0.12, RISE = 0.7;    // RISE: how far above the screen his grip is, in Peek units
const view = new PeekView(cv, { finish, unitsW: 4.4, unitsH: 3.4, notchY: NOTCH_Y, state: 'need' });
const p = view.puppet;
let U = 200;
const place = () => {
  // giant: the top of his head is past the top of the screen, so only his face hangs into view
  U = clamp(Math.min(innerWidth * (innerWidth < 720 ? 0.52 : 0.27), innerHeight * 0.42), 130, 420);
  view.resize(4.4 * U, 3.4 * U, Math.min(devicePixelRatio || 1, 1.5));
  cv.style.top = (-(NOTCH_Y + RISE) * U) + 'px';
};
place(); addEventListener('resize', place);

// pop out, look around, and die
p.tuck = 1; p.tuckTarget = 1;
let dead = false, busy = false;
const die = () => { dead = true; p.setState('error', now()); p.nudge(0.35, -1.2); sfx.wilt(); document.body.classList.add('dead'); };
(async () => {
  await sleep(reduced ? 0 : 500);
  p.tuckTarget = 0; sfx.popOut();                       // out of the notch
  await sleep(reduced ? 0 : 900);
  p.greet(now()); p.setState('think', now());           // ...where am I?
  await sleep(reduced ? 0 : 1300);
  die();
  // every so often: a twitch, or a brief comeback before flopping again
  for (let i = 0; ; i++) {
    await sleep(4200 + Math.random() * 2600);
    if (document.hidden || busy) continue;
    if (i % 3 === 2) { p.setState('need', now()); p.nudge(0, 1.2); await sleep(1100); if (!busy) die(); }
    else p.nudge((Math.random() < 0.5 ? -1 : 1) * 0.25, 0.6);
  }
})();

// click him: a new finish (shared with the landing page), a little jolt of life, then back to dead
const onPeek = (x, y) => {
  const r = cv.getBoundingClientRect(), P = p.lastPose || { pos: [0, -0.9, 0] };
  const cx = r.left + r.width / 2 + P.pos[0] * U, cy = r.top + NOTCH_Y * U - P.pos[1] * U;
  return ((x - cx) / (1.1 * U)) ** 2 + ((y - cy) / (1.0 * U)) ** 2 <= 1;
};
addEventListener('pointermove', e => {
  document.body.classList.toggle('on-peek', onPeek(e.clientX, e.clientY));
  const r = cv.getBoundingClientRect();
  view.gazeTarget = [clamp((e.clientX - r.left - r.width / 2) / (3 * U), -1, 1) * 0.14, clamp((e.clientY - r.top - r.height * 0.4) / (3 * U), -1, 1) * -0.1];
  view.gazeMix = 1;
}, { passive: true });
let perk = 0;
addEventListener('click', e => {
  if (e.target.closest('a') || !onPeek(e.clientX, e.clientY)) return;
  finish = LOOKS[(LOOKS.indexOf(finish) + 1) % LOOKS.length];
  localStorage.setItem('nsg-finish-v3', finish); view.finish = finish;
  sfx.boing(); sfx.material(finish.split('-')[0], LOOKS.indexOf(finish));
  busy = true; clearTimeout(perk);
  p.setState('done', now()); p.greet(now()); p.nudge(0.5 * (Math.random() < 0.5 ? -1 : 1), 1.4);
  perk = setTimeout(() => { busy = false; if (dead) die(); }, 1600);
});

// on a narrow screen he'd swing off the side, so the camera follows him a little
let follow = 0;
const frame = () => {
  const P = p.lastPose;
  const want = P && innerWidth < 720 ? -(P.pos[0] * 0.85 + (p.state === 'error' ? 0.4 : 0)) * U : 0;   // dead, he hangs off one arm, leaning right
  follow += (want - follow) * 0.06;
  cv.style.translate = `calc(-50% + ${follow.toFixed(1)}px) 0`;
  view.draw(now()); requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
</script>
</body>
</html>
