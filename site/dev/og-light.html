<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff}
.mac{position:absolute;left:44px;right:44px;top:40px;bottom:-40px;border:14px solid #0B0B0C;border-bottom:0;border-radius:40px 40px 0 0;
  -webkit-mask-image:linear-gradient(#000 0,#000 55%,transparent 98%);mask-image:linear-gradient(#000 0,#000 55%,transparent 98%)}
.n{position:absolute;left:50%;top:54px;transform:translateX(-50%);width:260px;height:52px;background:#000;z-index:3}
canvas{position:absolute;left:50%;transform:translateX(-50%);z-index:2}
h1{position:absolute;left:0;right:0;top:268px;text-align:center;font-size:66px;line-height:1.02;letter-spacing:-.045em;margin:0;opacity:1;transform:none;filter:none}
p{position:absolute;left:0;right:0;top:432px;text-align:center;margin:0;font-size:22px;color:#76767B;letter-spacing:-.01em}
.brandrow{position:absolute;left:50%;top:500px;white-space:nowrap;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font:650 20px var(--sans);letter-spacing:-.02em;color:#0B0B0C}
.brandrow svg{width:26px;height:26px;fill:#0B0B0C}
</style></head><body>
<div class="mac"></div><div class="n" id="n"></div><canvas id="c"></canvas>
<h1>Your coding agents,<br>right in your Mac’s notch.</h1>
<p>Approve, answer and reply to Claude Code and Codex.</p>
<div class="brandrow"><svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="23" rx="9"/><rect x="10.5" y="11.5" width="3.4" height="9" rx="1.7" fill="#fff"/><rect x="18.1" y="11.5" width="3.4" height="9" rx="1.7" fill="#fff"/></svg>Notch So Good · free for Mac</div>
<script type="module">
import { PeekView } from '../peek.js';
import { notchPath } from '../island.js';
const n = document.getElementById('n'); n.style.clipPath = notchPath(260, 52, 8, 26);
const q = new URLSearchParams(location.search);
const U = +(q.get('u') || 62), c = document.getElementById('c');
const v = new PeekView(c, { finish: q.get('f') || 'neon', unitsW: 4.4, unitsH: 3.4, notchY: 0.12, state: q.get('s') || 'need' });
v.resize(4.4*U, 3.4*U, +(q.get('dpr') || 1)); c.style.top = (54 + 52 - 0.12*U) + 'px';
const t = performance.now()/1000; v.puppet.since = t - 1.1; v.draw(t);
if (q.has('peek')) { document.body.innerHTML = ''; document.body.style.background = 'transparent'; window.peekPng = c.toDataURL('image/png'); }
window.done = true;
</script></body></html>
