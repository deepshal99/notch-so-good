<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
svg.edge{position:absolute;inset:0;width:1200px;height:630px}
canvas{position:absolute;left:50%;transform:translateX(-50%)}
.glow{position:absolute;left:50%;top:330px;width:700px;height:420px;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,150,60,0.16),rgba(255,150,60,0) 70%);filter:blur(10px)}
.brandline{position:absolute;left:0;right:0;bottom:40px;display:flex;align-items:center;justify-content:center;gap:11px;font:600 22px var(--sans);letter-spacing:-0.02em;color:rgba(255,255,255,0.92)}
.brandline svg{width:24px;height:24px}
</style></head><body>
<div class="glow"></div>
<svg class="edge" viewBox="0 0 1200 630" aria-hidden="true">
  <defs>
    <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.22" stop-color="#fff"/><stop offset="0.78" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="m"><rect width="1200" height="630" fill="url(#fade)"/></mask>
    <filter id="b1" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="b2" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <g mask="url(#m)" fill="none" stroke-linecap="round">
    <path id="edgePath" d=""/>
    <use href="#edgePath" stroke="#FF8A2A" stroke-width="10" opacity="0.55" filter="url(#b1)"/>
    <use href="#edgePath" stroke="#FFA54D" stroke-width="3" filter="url(#b2)"/>
    <use href="#edgePath" stroke="#FFE2BF" stroke-width="1.2"/>
  </g>
</svg>
<canvas id="c"></canvas>
<div class="brandline"><svg viewBox="0 0 32 32"><rect x="3" y="5" width="26" height="23" rx="9" fill="#fff"/><rect x="10.5" y="11.5" width="3.4" height="9" rx="1.7" fill="#000"/><rect x="18.1" y="11.5" width="3.4" height="9" rx="1.7" fill="#000"/></svg>Notch So Good</div>
<script type="module">
import { PeekView } from '../peek.js';
// the screen's top edge with the notch cut into it, traced like the app's NotchShape (concave top fillets, round bottom)
const top = 112, nh = 78, nw = 420, t = 14, b = 26, cx = 600, x0 = cx - nw / 2, x1 = cx + nw / 2, y1 = top + nh;
const d = `M 40 ${top} L ${x0} ${top} Q ${x0 + t} ${top} ${x0 + t} ${top + t} L ${x0 + t} ${y1 - b} Q ${x0 + t} ${y1} ${x0 + t + b} ${y1}
  L ${x1 - t - b} ${y1} Q ${x1 - t} ${y1} ${x1 - t} ${y1 - b} L ${x1 - t} ${top + t} Q ${x1 - t} ${top} ${x1} ${top} L 1160 ${top}`;
document.getElementById('edgePath').setAttribute('d', d);
const q = new URLSearchParams(location.search), U = +(q.get('u') || 142);
const c = document.getElementById('c');
const v = new PeekView(c, { finish: q.get('f') || 'neon', unitsW: 4.4, unitsH: 3.6, notchY: 0.12, state: 'need' });
v.resize(4.4 * U, 3.6 * U, 2); c.style.top = (y1 - 0.12 * U) + 'px';
const at = +(q.get('t') || 3.25), t0 = performance.now() / 1000;
v.puppet.since = t0 - at;
v.puppet.drop = +(q.get('d') || -0.08);   // hug the notch: a shorter reach than its usual "needs you" hang
// render until the shader is compiled, then hold the pose
const tick = () => { v.draw(t0); if (!v.shown) return requestAnimationFrame(tick); window.done = true; };
tick();
</script></body></html>
